<style>
/* Layout: uma coluna estreita, como uma página do caderno no celular; papel pontilhado, tinta azul no que a pessoa escreve. */
:root {
  --paper: #FAF8F4; --dot: #DDD6C8; --card: #FFFFFF; --line: #E2DCD0; --ink: #1D1C1A; --ink2: #4A453D; --muted: #776F64;
  --accent: #7A1F33; --accent-soft: #F6E9EB; --pen: #2F3A8F; --pen-soft: #ECEEF8; --ok: #2E6B4F; --warn: #8A5A00; --warn-soft: #FBF1DC;
  --red: #B3261E; --well: #F2EEE7; --ok-soft: #E4F1EA; --icon-bg: #7A1F33; --icon-fg: #FFFFFF;
  --f-display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141316; --dot: #2A2730; --card: #1D1B20; --line: #36323C; --ink: #F2EFEA; --ink2: #D2CCC3; --muted: #A0988D;
    --accent: #E58BA1; --accent-soft: #3A2029; --pen: #AEB8FF; --pen-soft: #23264A; --ok: #7FC8A4; --warn: #F0C066; --warn-soft: #3A2E14; --red: #FF8A80; --well: #18161B; --ok-soft: #1B3328;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141316; --dot: #2A2730; --card: #1D1B20; --line: #36323C; --ink: #F2EFEA; --ink2: #D2CCC3; --muted: #A0988D;
  --accent: #E58BA1; --accent-soft: #3A2029; --pen: #AEB8FF; --pen-soft: #23264A; --ok: #7FC8A4; --warn: #F0C066; --warn-soft: #3A2E14; --red: #FF8A80; --well: #18161B; --ok-soft: #1B3328;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--f-body);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }

/* topo */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.top .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.marca { display: flex; align-items: center; gap: 8px; font: 700 15px/1 var(--f-display); letter-spacing: -.01em; min-width: 0; }
.marca svg { width: 11px; height: 19px; flex: none; }
.marca .nm { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.marca .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca .nm small { font: 500 11px/1.15 var(--f-body); letter-spacing: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dir-top { display: flex; align-items: center; gap: 10px; }
.salvo { font: 500 12px/1 var(--f-body); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.salvo i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.salvo.erro i { background: var(--warn); }
.bt-pag { font: 600 13px/1 var(--f-body); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 0 12px; min-height: 34px; cursor: pointer; }
.trilha { display: flex; gap: 3px; margin-top: 10px; }
.trilha button { flex: 1; height: 5px; border: 0; border-radius: 3px; background: var(--line); padding: 0; cursor: pointer; }
.trilha button.feito { background: var(--accent); opacity: .45; }
.trilha button.agora { background: var(--accent); }
.aviso { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
.top .aviso { margin-top: 10px; font-size: 14px; }

/* índice */
.indice { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.indice .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.indice .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.indice h2 { font: 800 26px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.indice .grp { font: 600 11.5px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 14px 0 2px; }
.indice .it { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--line);
  border-radius: 12px; padding: 0 14px; min-height: 50px; font: 500 16px/1.25 var(--f-body); color: var(--ink); cursor: pointer; }
.indice .it.agora { border-color: var(--accent); }
.indice .it small { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* páginas */
.pg { padding-top: 22px; display: flex; flex-direction: column; gap: 16px; }
.eb { font: 600 12px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
h1 { font: 800 clamp(30px, 8.6vw, 40px)/1.02 var(--f-display); letter-spacing: -.03em; margin: 4px 0 0; text-wrap: balance; }
.lead { font-size: 17px; line-height: 1.5; color: var(--ink2); margin: 0; }
.nota { font-size: 14px; line-height: 1.45; color: var(--muted); margin: 0; }
.capa h1 { font-size: clamp(46px, 14vw, 64px); line-height: .94; letter-spacing: -.045em; }

/* caixas e campos */
.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.box.forte { border: 1.5px solid var(--accent); }
.box.ink { border: 1.5px solid var(--ink); }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo > label, .rot { font: 600 11.5px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rot.ac { color: var(--accent); }
input[type="text"], input[type="date"], textarea.t {
  width: 100%; font: 500 18px/1.35 var(--f-body); color: var(--pen); background: transparent;
  border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 8px 2px 7px; min-height: 44px; -webkit-appearance: none; appearance: none;
}
textarea.t { resize: none; overflow: hidden; display: block; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
input[type="date"] { display: block; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .6; font-weight: 400; }
input:focus, textarea:focus { outline: none; border-bottom-color: var(--pen); background: var(--pen-soft); }
textarea.bk { width: 100%; min-height: 90px; font: 400 16px/1.4 ui-monospace, Menlo, monospace; color: var(--ink2); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; background: transparent; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g2 > * { min-width: 0; }
.calc { font: 500 18px/1.3 var(--f-body); color: var(--pen); padding: 8px 2px 7px; border-bottom: 1.5px dashed var(--line); min-height: 44px; overflow-wrap: anywhere; }
.calc.vz { color: var(--muted); font-weight: 400; font-size: 15px; }
.linha { display: flex; align-items: flex-start; gap: 8px; }
.linha .q { font-size: 14px; line-height: 21px; color: var(--ink2); white-space: nowrap; padding-top: 11px; }
.linha .chip { margin-top: 4px; }
.linha .mini { padding-top: 13px; }
.linha input, .linha textarea { flex: 1; min-width: 0; }
.chip { font: 600 14px/1 var(--f-body); border: 1.5px solid var(--pen); color: var(--pen); background: transparent; border-radius: 999px; padding: 0 14px; min-height: 36px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--pen); color: var(--card); }
.chip.red { border-color: var(--red); color: var(--red); }
.chip.red.on { background: var(--red); color: var(--card); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts .chip { min-height: 36px; font-size: 14px; padding: 0 12px; }
.vazia { color: var(--muted); font-size: 14px; padding: 2px 0; }
.mini { font: 500 14px/1 var(--f-body); color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 10px 0; }

/* cadeiras */
.cad { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.cad.dir { border: 1.5px solid var(--accent); }
.cad .nome { font: 700 13px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
.cad .desc { font-size: 13.5px; color: var(--muted); line-height: 1.35; margin-top: -4px; }

/* caixinha */
.ck { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 16px; line-height: 1.4; color: var(--ink); padding: 6px 0; position: relative; }
.ck input { position: absolute; opacity: 0; width: 1px; height: 1px; left: 0; top: 0; }
.ck .b { width: 26px; height: 26px; flex: none; border: 1.8px solid var(--muted); border-radius: 7px; display: grid; place-items: center; background: var(--card); margin-top: -1px; }
.ck .b svg { width: 16px; height: 16px; opacity: 0; }
.ck input:checked + .b { border-color: var(--pen); background: var(--pen-soft); }
.ck input:checked + .b svg { opacity: 1; }
.ck input:focus-visible + .b { outline: 3px solid var(--pen); outline-offset: 2px; }
.ck small { display: block; color: var(--muted); font-size: 13px; }

/* ordem */
.ord { display: flex; flex-direction: column; gap: 8px; }
.ord button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 56px; font: 500 16px/1.3 var(--f-body); color: var(--ink); cursor: pointer; }
.ord button .n { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1.5px dashed var(--muted); display: grid; place-items: center; font: 700 14px/1 var(--f-body); color: var(--muted); }
.ord button.on { border-color: var(--pen); }
.ord button.on .n { border: 0; background: var(--pen); color: var(--card); }
.ord button .s { font-size: 13.5px; color: var(--muted); display: block; }
.ord button.primeira { box-shadow: 0 0 0 2.5px var(--pen); border-color: transparent; }

/* resultado */
.res { background: var(--card); border: 1.5px solid var(--accent); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.res .big { font: 800 44px/1 var(--f-display); color: var(--pen); letter-spacing: -.03em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; font-size: 15px; }
.kv b { font-weight: 600; white-space: nowrap; }
.kv span { color: var(--pen); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }

/* dias da semana */
.dia { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.dia.forte { border: 1.5px solid var(--accent); }
.dia .dh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.dia .dn { font: 700 17px/1.2 var(--f-body); }
.dia .dn span { color: var(--accent); }
.dia .tm { font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.num-l { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; }
.num-l .n { font: 700 14px/21px var(--f-body); color: var(--accent); padding-top: 11px; }
.chama { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.chama .topo2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font: 600 20px/1 var(--f-body); color: var(--ink); cursor: pointer; }
.stepper output { font: 700 24px/1 var(--f-display); color: var(--pen); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.conta { display: flex; flex-direction: column; gap: 10px; }
.conta .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
.conta .fixo { font: 700 24px/1 var(--f-display); color: var(--pen); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }

/* terça */
.terca { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; align-items: start; }
.terca .n { font: 800 22px/1 var(--f-display); color: var(--accent); padding-top: 12px; }
.terca .c { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.terca textarea.nao { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 4px; }

/* fichas (contratos, passo a passo, chamadas) */
.ficha { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ficha > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ficha > summary::-webkit-details-marker { display: none; }
.ficha > summary b { font: 700 17px/1.25 var(--f-body); }
.ficha > summary small { display: block; color: var(--muted); font-size: 13.5px; font-weight: 400; }
.ficha > summary .seta { color: var(--muted); font-size: 18px; transition: transform .15s; }
.ficha[open] > summary .seta { transform: rotate(90deg); }
.ficha .corpo { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.txt { font-size: 16px; line-height: 1.55; color: var(--ink); }
.txt input.inl { display: inline-block; width: 7.5em; min-height: 34px; padding: 2px 4px 3px; font-size: 16px; vertical-align: baseline; }
.ent { display: grid; grid-template-columns: 20px 1fr; gap: 6px; }
.ent b { color: var(--accent); }

/* franquia */
.regra { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.regra:first-child { border-top: 0; padding-top: 0; }
.regra .k { font: 700 15px/1.3 var(--f-body); color: var(--muted); }
.regra .t { font: 600 16px/1.35 var(--f-body); }
.regra .a { font-size: 14px; line-height: 1.4; color: var(--ink2); margin-top: 4px; }
.regra .a b { color: var(--accent); }
.regra .nl { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.pill { display: inline-block; background: var(--accent); color: var(--card); font: 700 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 6px 10px; }

/* navegação no fim da página */
.nav { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.btn { flex: 1; min-height: 52px; border-radius: 14px; font: 600 16px/1.2 var(--f-body); cursor: pointer; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.sec { border-color: var(--pen); color: var(--pen); }
.btn:focus-visible, .chip:focus-visible, .ord button:focus-visible, .mini:focus-visible, .trilha button:focus-visible, .bt-pag:focus-visible, .indice .it:focus-visible, .stepper button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.ol li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 15.5px; line-height: 1.45; color: var(--ink2); }
.ol li > b { color: var(--accent); }
.conf { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.conf .nav { margin: 0; }
.ok-msg { color: var(--ok); font-size: 14px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .pg { animation: entra .18s ease-out; } @keyframes entra { from { opacity: .4; transform: translateY(4px); } } }

/* instalação: passos numerados com o desenho do botão que a pessoa toca */
.passos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.passo { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; }
.pn { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--card); display: grid; place-items: center; font: 700 14px/1 var(--f-body); margin-top: -2px; }
.pc { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pc h3 { font: 700 17px/1.25 var(--f-body); margin: 0; text-wrap: balance; }
.pc p { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--ink2); }
.pc .dica { font-size: 13.5px; color: var(--muted); }
.ilu { margin: 2px 0 0; background: var(--well); border-radius: 12px; padding: 8px; }
.ilu svg { display: block; width: 100%; height: auto; }
.ilu .k { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.ilu .m { fill: var(--line); }
.ilu .sep { stroke: var(--line); stroke-width: 1; }
.ilu .st { fill: none; stroke: var(--ink2); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ilu .dt { fill: var(--ink); }
.ilu .t { font: 500 12px var(--f-body); fill: var(--ink2); }
.ilu .ts { font: 500 11px var(--f-body); fill: var(--muted); }
.ilu .tb { font: 600 12.5px var(--f-body); fill: var(--ink); }
.ilu .th { font: 700 14px var(--f-body); fill: var(--ink); }
.ilu .tm { font: 500 12.5px var(--f-body); fill: var(--muted); }
.ilu .hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
.ilu .ring { fill: none; stroke: var(--accent); stroke-width: 2.4; }
.ilu .tog { fill: var(--ok); }
.ilu .knob { fill: var(--card); }
.ilu .ibg { fill: var(--icon-bg); }
.ilu .ifg { fill: var(--icon-fg); }
.ilu .ifs { fill: none; stroke: var(--icon-bg); stroke-width: 1.05; stroke-linecap: round; }
.ilu .ifc { fill: var(--icon-bg); }
@media (prefers-reduced-motion: no-preference) { .ilu .ring { animation: pulso 1.8s ease-in-out infinite; } @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .3; } } }
.pronto { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
.link { display: flex; flex-direction: column; gap: 8px; }
.link input { width: 100%; font: 500 16px/1.3 var(--f-body); color: var(--pen); background: var(--pen-soft); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.link input:focus { outline: 3px solid var(--pen); outline-offset: 1px; }
.btn.big { width: 100%; flex: none; min-height: 60px; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.big svg { width: 18px; height: 18px; }
.ou { display: flex; align-items: center; gap: 10px; font: 600 12px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ou::before, .ou::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.qr { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* impressão: só o caderno preenchido, em papel A4 */
#imp { display: none; }
@media print {
  @page { size: A4; margin: 14mm 14mm 16mm; }
  :root { --ink: #1D1C1A; --pen: #2F3A8F; --muted: #6F695F; --accent: #7A1F33; --line: #CFC8BA; --red: #B3261E; }

  function qr() {

        box.innerHTML = `<svg viewBox="${-p} ${-p} ${n + 2 * p} ${n + 2 * p}" shape-rendering="crispEdges" role="img" aria-label="Código QR com o link do caderno"><rect x="${-p}" y="${-p}" width="${n + 2 * p}" height="${n + 2 * p}" class="qr-bg"/><path d="${d}" class="qr-fg"/></svg>`;
      } catch (e) { const q = $("#qr"); if (q) q.hidden = true; }
    };
    if (typeof window.qrcode === "function") return desenha();
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";

  document.addEventListener("toggle", e => { const d = e.target; if (d.classList && d.classList.contains("ficha")) { d.open ? ABERTOS.add(d.dataset.id) : ABERTOS.delete(d.dataset.id); if (d.open) cresce(); } }, true);
  document.addEventListener("click", e => {

    if (d.flip) { poe(d.flip, !pega(d.flip)); salva(); redesenha(); return; }
    if (d.set) { poe(d.set, pega(d.set) === d.v ? "" : d.v); salva(); redesenha(); return; }
    if (d.prox) { const s = S.sem[+d.prox].sexta; s.prox = s.prox === d.v ? "" : d.v; if (s.prox && s.prox !== "teste" && !s.pquem) s.pquem = cad(s.prox).assume || ""; salva(); redesenha(); return; }
    if (d.add) { const L = pega(d.add) || []; L.push(d.tpl === "cham" ? { dia: "", quem: "", oque: "", virou: "" } : d.tpl === "chamada" ? { data: iso(new Date()), cad: "", quem: "", oque: "", virou: "", escrevi: false } : ""); poe(d.add, L); salva(); redesenha(); return; }
    if (d.del) { const L = pega(d.del); L.splice(+d.i, 1); salva(); redesenha(); return; }
    const ac = d.acao;

    if (ac === "inst-nao") { instConf = false; redesenha(); return; }

    if (ac === "copiar-link") { const inp = $("#link"), ok = () => { $("#copiado").hidden = false; }, marca = () => { inp.focus(); inp.select(); };

    if (ac === "fecha-indice") { fechaIndice(); return; }
    if (ac === "exemplo") { $("#conf-ex").innerHTML = `<div class="conf">Isso troca o que você já escreveu pelo exemplo. Trocar?<div class="nav"><button class="btn" data-acao="nao-ex">Não</button><button class="btn pri" data-acao="sim-ex">Trocar</button></div></div>`; return; }
    if (ac === "nao-ex") { $("#conf-ex").innerHTML = ""; return; }

    if (ac === "abre-contrato") { const k = +d.k, nome = nomeCad(semCad(k)), q = semQuem(k); let c = S.contratos.find(x => (x.cad || "").trim().toLowerCase() === nome.toLowerCase());
      if (!c) { const id = Date.now(); c = { id, modelo: PRONTOS[nome] ? nome : "", cad: nome, quem: q, data: S.sem[k].de ? soma(S.sem[k].de, 1) : "", ent: ["", "", ""], mede: "", padrao: "", resp: "Direção", rev: "30 dias", val: {}, ajustes: [] }; S.contratos.push(c); }
      ABERTOS.add("c" + c.id); salva(); mostra("contratos"); const el = document.querySelector(`[data-id="c${c.id}"]`); if (el) el.scrollIntoView({ block: "start" }); return; }
    if (ac === "abre-passos") { const k = +d.k, s = S.sem[k], nome = nomeCad(semCad(k)), q = semQuem(k); let ultimo;
      s.tarefas.filter(t => t.trim()).forEach(t => { const ja = S.passos.find(x => x.tarefa.trim().toLowerCase() === t.trim().toLowerCase()); if (ja) ABERTOS.add("p" + ja.id); else { const id = Date.now() + Math.random(); ultimo = id;

      if (!ultimo && !s.tarefas.some(t => t.trim())) { const id = Date.now(); S.passos.push({ id, tarefa: "", cad: nome, quem: q, tempo: "", quando: "", passos: Array(8).fill(""), pronto: "", errado: "", escrito: iso(new Date()), rev: soma(iso(new Date()), 30) }); ABERTOS.add("p" + id); }
      salva(); mostra("passos"); return; }

    if (ac === "apaga-ficha") { const box = document.querySelector(`[data-conf="${d.lista}-${d.i}"]`); box.innerHTML = `<div class="conf">Apagar de vez?<div class="nav"><button class="btn" data-acao="nao-apaga-ficha" data-lista="${d.lista}" data-i="${d.i}">Não</button><button class="btn pri" data-acao="sim-apaga-ficha" data-lista="${d.lista}" data-i="${d.i}">Apagar</button></div></div>`; return; }
    if (ac === "nao-apaga-ficha") { document.querySelector(`[data-conf="${d.lista}-${d.i}"]`).innerHTML = ""; return; }
    if (ac === "sim-apaga-ficha") { S[d.lista].splice(+d.i, 1); salva(); redesenha(); return; }
    if (ac === "imprime-contrato") { imprime(impContrato(S.contratos[+d.i])); return; }
    if (ac === "imprime-passo") { imprime(impPasso(S.passos[+d.i])); return; }
    if (ac === "imprime-tudo") { imprime(impTudo()); return; }
    if (ac === "agenda") { agenda(); return; }
    if (ac === "baixar") { const n = (S.capa.de || "caderno").normalize("NFD").replace(/[^\w]+/g, "-").toLowerCase(); baixa(JSON.stringify(S, null, 1), `copia-caderno-sem-mim-${n}-${iso(new Date())}.json`, "application/json"); $("#bk-msg").textContent = "Cópia baixada. Guarda em Arquivos, no iCloud ou no Drive."; return; }
    if (ac === "copiar") { const t = $("#bk"); try { navigator.clipboard.writeText(t.value).then(() => { $("#bk-msg").textContent = "Copiado. Guarda nas Notas ou manda pra você mesmo."; }, () => t.select()); } catch (x) { t.select(); } return; }
    if (ac === "restaurar-texto") { try { restaura($("#rest").value); } catch (x) { $("#bk-msg").textContent = "Não reconheci esse texto. Cola a cópia inteira."; } return; }
    if (ac === "apagar") { $("#conf-apagar").innerHTML = `<div class="conf">Apagar tudo o que você escreveu neste celular? Não dá pra desfazer.<div class="nav"><button class="btn" data-acao="nao-apagar">Não</button><button class="btn pri" data-acao="sim-apagar">Apagar</button></div></div>`; return; }
    if (ac === "nao-apagar") { $("#conf-apagar").innerHTML = ""; return; }
    if (ac === "sim-apagar") { const inst = S.inst; S = vazio(); S.inst = inst; mostra("capa"); return; }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("#indice").hidden) fechaIndice();

  if (!guarda) $("#aviso").hidden = false;
  if (S.pag === "instala") S.pag = "capa";
  mostra(!APP && !S.inst.aqui ? "instala" : S.pag, false);

  if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
